[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcmigrate"
version = "0.2.2"
description = "PC 이전 도우미: 구 PC의 업무용 환경을 새 PC로 안전하게 이전"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pcmigrate = "pcmigrate.cli:main"

# 저장소 루트의 rules/*.json 을 패키지 데이터(pcmigrate/rules_data/)로 함께 설치한다(pip 일반 설치에서도 규칙이 들어 있도록).
# 같은 방식으로 저장소의 selftransfer/*.json(자체 이전 필요 프로그램 목록)도 pcmigrate/selftransfer_data/ 로 설치한다.
# 소스 트리/편집 설치에서는 rules.default_rules_dir() 가 저장소의 rules/ 를 그대로 쓴다. exe 는 build_exe.py 의 --add-data 로 번들한다.
[tool.setuptools]
package-dir = {"" = "src", "pcmigrate.rules_data" = "rules", "pcmigrate.selftransfer_data" = "selftransfer"}
packages = ["pcmigrate", "pcmigrate.gui", "pcmigrate.gui.views", "pcmigrate.rules_data", "pcmigrate.selftransfer_data"]

[tool.setuptools.package-data]
"pcmigrate.rules_data" = ["*.json"]
"pcmigrate.selftransfer_data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
